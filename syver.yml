---

# Host facts that decide whether a test applies; the test is skipped with a reason when it does not
# Partitions the role only checks when they exist (1.1.2.3 - 1.1.2.7 mount options)
discovery:
  mount:
    /home:
      register: home_mounted
      exists: true
    /var:
      register: var_mounted
      exists: true
    /var/tmp:
      register: var_tmp_mounted
      exists: true
    /var/log:
      register: var_log_mounted
      exists: true
    /var/log/audit:
      register: var_log_audit_mounted
      exists: true
  # 2.4.x cron and at checks only apply when the package is installed
  # 2.1.22 the postfix main.cf check only applies when postfix is installed
  package:
    postfix:
      register: postfix_installed
      installed: true
    cron:
      register: cron_installed
      installed: true
    at:
      register: at_installed
      installed: true
  # 2.4.1.7 /etc/cron.yearly may not exist
  # 7.1.x backup and opasswd files the benchmark says may not exist
  file:
    # 3.1.1 the sysctl disable file is only written when the kernel provides IPv6 (not booted with ipv6.disable=1)
    /proc/sys/net/ipv6:
      register: ipv6_kernel_present
      exists: true
    /etc/cron.yearly:
      register: cron_yearly_present
      exists: true
    /etc/passwd-:
      register: passwd_backup_exists
      exists: true
    /etc/group-:
      register: group_backup_exists
      exists: true
    /etc/shadow-:
      register: shadow_backup_exists
      exists: true
    /etc/gshadow-:
      register: gshadow_backup_exists
      exists: true
    /etc/security/opasswd:
      register: opasswd_exists
      exists: true

