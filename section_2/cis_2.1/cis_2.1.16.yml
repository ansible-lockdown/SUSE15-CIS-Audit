---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_2_1_16 }}
    {{ if not .Vars.suse15cis_telnet_mask }}
package:
  telnet_pkg:
    title: 2.1.16 | Ensure telnet server services are not in use | pkg removed
    skip: {{ .Vars.suse15cis_telnet_server }}
    skip-reason: a telnet server is required, suse15cis_telnet_server is true
    name: telnet-server
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.suse15cis_telnet_mask }}
file:
  telnet_socket_masked:
    title: 2.1.16 | Ensure telnet server services are not in use | masked
    skip: {{ .Vars.suse15cis_telnet_server }}
    skip-reason: a telnet server is required, suse15cis_telnet_server is true
    path: /etc/systemd/system/telnet.socket
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.16
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
