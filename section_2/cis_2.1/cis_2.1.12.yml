---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_2_1_12 }}
    {{ if not .Vars.suse15cis_print_mask }}
package:
  cups_pkg:
    title: 2.1.12 | Ensure print server services are not in use | pkg removed
    skip: {{ .Vars.suse15cis_print_server }}
    skip-reason: a print server is required, suse15cis_print_server is true
    name: cups
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.suse15cis_print_mask }}
file:
  cups_service_masked:
    title: 2.1.12 | Ensure print server services are not in use | masked
    skip: {{ .Vars.suse15cis_print_server }}
    skip-reason: a print server is required, suse15cis_print_server is true
    path: /etc/systemd/system/cups.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-7
  cups_socket_masked:
    title: 2.1.12 | Ensure print server services are not in use | masked
    skip: {{ .Vars.suse15cis_print_server }}
    skip-reason: a print server is required, suse15cis_print_server is true
    path: /etc/systemd/system/cups.socket
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.12
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
