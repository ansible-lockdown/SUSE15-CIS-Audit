---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_2_1_9 }}
    {{ if not .Vars.suse15cis_message_mask }}
package:
  dovecot_pkg:
    title: 2.1.9 | Ensure message access server services are not in use | pkg removed
    skip: {{ .Vars.suse15cis_message_server }}
    skip-reason: a message access server is required, suse15cis_message_server is true
    name: dovecot
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-7
  cyrus_imapd_pkg:
    title: 2.1.9 | Ensure message access server services are not in use | pkg removed
    skip: {{ .Vars.suse15cis_message_server }}
    skip-reason: a message access server is required, suse15cis_message_server is true
    name: cyrus-imapd
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-7
    {{ end }}
    {{ if .Vars.suse15cis_message_mask }}
file:
  dovecot_service_masked:
    title: 2.1.9 | Ensure message access server services are not in use | masked
    skip: {{ .Vars.suse15cis_message_server }}
    skip-reason: a message access server is required, suse15cis_message_server is true
    path: /etc/systemd/system/dovecot.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-7
  dovecot_socket_masked:
    title: 2.1.9 | Ensure message access server services are not in use | masked
    skip: {{ .Vars.suse15cis_message_server }}
    skip-reason: a message access server is required, suse15cis_message_server is true
    path: /etc/systemd/system/dovecot.socket
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-7
  cyrus_service_masked:
    title: 2.1.9 | Ensure message access server services are not in use | masked
    skip: {{ .Vars.suse15cis_message_server }}
    skip-reason: a message access server is required, suse15cis_message_server is true
    path: /etc/systemd/system/cyrus-imapd.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.9
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
