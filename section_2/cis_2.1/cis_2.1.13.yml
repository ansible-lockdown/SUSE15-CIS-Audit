---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_2_1_13 }}
    {{ if not .Vars.suse15cis_rpc_mask }}
package:
  rpcbind_pkg:
    title: 2.1.13 | Ensure rpcbind services are not in use | pkg removed
    skip: {{ .Vars.suse15cis_rpc_server }}
    skip-reason: rpcbind is required, suse15cis_rpc_server is true
    name: rpcbind
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.suse15cis_rpc_mask }}
file:
  rpcbind_service_masked:
    title: 2.1.13 | Ensure rpcbind services are not in use | masked
    skip: {{ .Vars.suse15cis_rpc_server }}
    skip-reason: rpcbind is required, suse15cis_rpc_server is true
    path: /etc/systemd/system/rpcbind.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-6
      - CM-7
  rpcbind_socket_masked:
    title: 2.1.13 | Ensure rpcbind services are not in use | masked
    skip: {{ .Vars.suse15cis_rpc_server }}
    skip-reason: rpcbind is required, suse15cis_rpc_server is true
    path: /etc/systemd/system/rpcbind.socket
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.13
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
