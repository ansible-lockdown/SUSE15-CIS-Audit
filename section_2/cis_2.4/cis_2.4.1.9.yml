---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_2_4_1_9 }}
file:
  cron_deny_absent:
    title: 2.4.1.9 | Ensure access to crontab is configured
    skip: {{ not .Discovered.cron_installed }}
    skip-reason: cron is not installed, cron package absent
    path: /etc/cron.deny
    exists: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.1.9
      NIST800-53R5:
      - AC-3
      - MP-2
  cron_allow_restricted:
    title: 2.4.1.9 | Ensure access to crontab is configured
    skip: {{ not .Discovered.cron_installed }}
    skip-reason: cron is not installed, cron package absent
    path: /etc/cron.allow
    exists: true
    owner: root
    group: root
    mode: "0640"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.4.1.9
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
