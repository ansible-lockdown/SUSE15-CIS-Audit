---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_7_1_8 }}
file:
  gshadow-_perms:
    title: 7.1.8 | Ensure access to /etc/gshadow- is configured
    skip: {{ not .Discovered.gshadow_backup_exists }}
    skip-reason: /etc/gshadow- is a backup written by account-management tools and does not exist on this host
    path: /etc/gshadow-
    exists:
      or:
      - true
      - false
    owner: root
    group:
      or:
      - root
      - shadow
    mode:
      or:
      - "0640"
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
