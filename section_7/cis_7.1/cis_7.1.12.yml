---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_7_1_12 }}
command:
  unowned_dirs:
    title: 7.1.12 | Ensure no files or directories without an owner and a group exist
    skip: {{ not .Vars.run_heavy_tests }}
    skip-reason: heavy filesystem scans are disabled (run_heavy_tests is false)
    exec: |
      findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs)/ && $2 !~ /^(\/run|\/tmp|\/var\/tmp)(\/|$)/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev \( -path "*/containers/storage/*" -o -path "*/containerd/*" -o -path "*/kubelet/*" -o -path "/sys/*" -o -path "/snap/*" -o -path "/boot/efi/*" -o -path "/var/*/private/*" \) -prune -o \( -type f -o -type d \) \( -nouser -o -nogroup \) -printf 'FAIL: %u %g %p\n' 2>/dev/null
      done | grep -v journal-upload
      echo "scan_done"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.12
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
