---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_7_1_6 }}
file:
  shadow-_perms:
    title: 7.1.6 | Ensure access to /etc/shadow- is configured
    skip: {{ not .Discovered.shadow_backup_exists }}
    skip-reason: /etc/shadow- is a backup written by account-management tools and does not exist on this host
    path: /etc/shadow-
    exists: true
    owner: root
    group:
      or:
      - root
      - shadow
    mode:
      or:
      - "0640"
      - "0600"
      - "0400"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
