---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_7_2_8 }}
command:
  home_dirs_exist:
    title: 7.2.8 | Ensure local interactive user home directories are configured | Directories exist
    exec: |
      awk -F: 'NR == FNR { if ($0 ~ /^\// && $0 !~ /\/nologin$/) l_shells[$0] = 1; next } ($7 in l_shells) { print $1 ":" $6 }' /etc/shells /etc/passwd | while IFS=: read -r l_user l_home; do
        [ -d "$l_home" ] || echo "User $l_user home $l_home does not exist"
      done
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.8
      NIST800-53R5: NA
  home_dirs_ownership:
    title: 7.2.8 | Ensure local interactive user home directories are configured | Directory ownership
    exec: |
      awk -F: 'NR == FNR { if ($0 ~ /^\// && $0 !~ /\/nologin$/) l_shells[$0] = 1; next } ($7 in l_shells) { print $1 ":" $6 }' /etc/shells /etc/passwd | while IFS=: read -r l_user l_home; do
        [ -d "$l_home" ] || continue
        l_own="$(stat -Lc '%U' "$l_home")"
        [ "$l_own" = "$l_user" ] || echo "User $l_user home $l_home is owned by $l_own"
      done
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.8
      NIST800-53R5: NA
  home_dirs_permissions:
    title: 7.2.8 | Ensure local interactive user home directories are configured | Directory permissions
    exec: |
      awk -F: 'NR == FNR { if ($0 ~ /^\// && $0 !~ /\/nologin$/) l_shells[$0] = 1; next } ($7 in l_shells) { print $1 ":" $6 }' /etc/shells /etc/passwd | while IFS=: read -r l_user l_home; do
        [ -d "$l_home" ] || continue
        l_mode="$(stat -Lc '%a' "$l_home")"
        [ $(( 0$l_mode & 027 )) -eq 0 ] || echo "User $l_user home $l_home is mode $l_mode, should be 750 or more restrictive"
      done
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.2.8
      NIST800-53R5: NA
  {{ end }}
{{ end }}
