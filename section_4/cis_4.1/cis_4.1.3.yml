---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_4_1_3 }}
    {{ if eq .Vars.suse15cis_firewall_package "firewalld" }}
command:
  cis_4_1_3:
    title: 4.1.3 | Ensure firewalld active zone target is configured
    exit-status: 0
    exec: "zones=$(firewall-cmd --get-active-zones 2>/dev/null | awk '!/^ /{print $1}'); [ -z \"$zones\" ] && echo 'no active zone'; for z in $zones; do i=$(firewall-cmd --zone=$z --list-interfaces); echo \"$i\" | grep -Eqx '(lo|virbr[^ ]+)?' && continue; t=$(firewall-cmd --permanent --zone=$z --get-target); case $t in ACCEPT|'') echo \"$z target=$t interfaces=$i\";; esac; done"
    stdout: ['!/./']
    meta:
      server: 2
      workstation: "NA"
      CIS_ID:
      - 4.1.3
      NIST800-53R5:
      - NA
    {{ end }}
  {{ end }}
{{ end }}
