---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_4_2_3 }}
command:
  firewall_loopback_manual:
    title: 4.2.3 | Ensure firewalld loopback traffic is configured | Manual Check Required
    exec: echo "Manual check - confirm the loopback interface is trusted and that traffic to 127.0.0.1 and ::1 from other interfaces is dropped"
    exit-status: 0
    stdout: []
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.3
      NIST800-53R5: CA-9
  {{ end }}
{{ end }}
