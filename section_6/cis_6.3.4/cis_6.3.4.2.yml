---

{{ if .Vars.suse15cis_level_2 }}
{{ if .Vars.suse15cis_rule_6_3_4_2 }}
command:
  audit_logfile_perms:
    title: 6.3.4.2 | Ensure audit log files mode is configured
    exec: l_dir="$(dirname "$(awk -F= '/^[[:space:]]*log_file[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2}' /etc/audit/auditd.conf)")"; find "$l_dir" -maxdepth 1 -type f -perm /0137 -printf '%p %m\n'
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.4.2
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
