---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_6_1_3_1 }}
command:
  logfile_access_configured:
    title: 6.1.3.1 | Ensure access to all logfiles has been configured
    exec: |
      find -L /var/log -type f \( -perm /0137 -o ! -user root -o ! -group root \) -exec stat -Lc '%n:%a:%U:%G' {} + 2>/dev/null | awk -F: '
        FNR == NR && FILENAME == "/etc/shells" { if ($0 ~ /^[[:space:]]*\//) { sub(/^[[:space:]]+/, ""); sub(/[[:space:]].*$/, ""); shells[$0] = 1 }; next }
        FILENAME == "/etc/passwd" { ushell[$1] = $7; next }
        function band(a, b,   r, bit) { r = 0; for (bit = 4; bit >= 1; bit = bit / 2) { if (a >= bit && b >= bit) r += bit; if (a >= bit) a -= bit; if (b >= bit) b -= bit }; return r }
        function excess(mode, mask,   i, m) { m = substr("000" mode, length(mode) + 1, 3); for (i = 1; i <= 3; i++) if (band(substr(m, i, 1) + 0, substr(mask, i, 1) + 0) > 0) return 1; return 0 }
        {
          fname = $1; mode = $2; user = $3; group = $4
          n = split(fname, p, "/"); base = p[n]; dir = substr(fname, 1, length(fname) - length(base) - 1)
          if (dir ~ /\/apt$/) { mask = "133"; au = "root"; ag = "root|adm" }
          else if (base ~ /^(lastlog|wtmp|btmp)([.-].*)?$/ || base == "README") { mask = "113"; au = "root"; ag = "root|utmp" }
          else if (base ~ /^(cloud-init\.log|localmessages|waagent\.log)/) { mask = "133"; au = "root|syslog"; ag = "root|adm" }
          else if (base ~ /^secure([.-].*)?$/ || base ~ /^(auth\.log|syslog|messages)$/) { mask = "137"; au = "root|syslog"; ag = "root|adm" }
          else if (base ~ /^(SSSD|sssd)$/) { mask = "117"; au = "root|SSSD"; ag = "root|SSSD" }
          else if (base ~ /^(gdm|gdm3)$/) { mask = "117"; au = "root"; ag = "root|gdm|gdm3" }
          else if (base ~ /\.journal~?$/) { mask = "137"; au = "root"; ag = "root|systemd-journal" }
          else {
            mask = "137"; au = "root|syslog"; ag = "root|adm"
            if (user == "root" || !(ushell[user] in shells)) { au = au "|" user; ag = ag "|" group }
          }
          bad = ""
          if (excess(mode, mask)) bad = bad " mode=" mode
          if (user !~ ("^(" au ")$")) bad = bad " owner=" user
          if (group !~ ("^(" ag ")$")) bad = bad " group=" group
          if (bad != "") print fname ":" bad
        }' /etc/shells /etc/passwd -
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.3.1
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
