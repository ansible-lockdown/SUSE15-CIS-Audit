---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_6_1_1_5 }}
command:
  storage_journald_conf:
    title: 6.1.1.5 | Ensure journald Storage is configured
    exec: grep -i storage /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/(?i)^.*:Storage=persistent/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.5
      NIST800-53R5:
      - AU-3
      - AU-12
  {{ end }}
{{ end }}
