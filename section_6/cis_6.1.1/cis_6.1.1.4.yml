---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_6_1_1_4 }}
command:
  compress_journald_conf:
    title: 6.1.1.4 | Ensure journald Compress is configured
    skip: {{ ne .Vars.suse15cis_syslog "journald" }}
    skip-reason: rsyslog is the logging method, suse15cis_syslog is not journald
    exec: grep -i compress /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/(?i)^.*:Compress\s*=\s*yes/'
    - '!/(?i)^.*:Compress\s*=\s*no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.1.4
      NIST800-53R5:
      - AU-4
  {{ end }}
{{ end }}
