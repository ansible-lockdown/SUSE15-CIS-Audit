---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_3_3_21 }}
command:
  auditd_config_match:
    title: 6.3.3.21 | Ensure the running and on disk configuration is the same
    exec: augenrules --check
    exit-status: 0
    stdout:
    - '/.*: No change/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.21
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
