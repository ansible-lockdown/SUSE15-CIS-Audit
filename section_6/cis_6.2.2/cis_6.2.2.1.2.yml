---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_6_2_2_1_2 }}
command:
  journald_remote_config:
    title: 6.2.2.1.2 | Ensure systemd-journal-upload authentication is configured
    skip: {{ or (ne .Vars.suse15cis_syslog "journald") .Vars.suse15cis_system_is_log_server }}
    exec: systemd-analyze cat-config systemd/journal-upload.conf
    exit-status: 0
    stdout:
    - '/^\s*URL=\S+/'
    - '/^\s*ServerKeyFile=\S+/'
    - '/^\s*ServerCertificateFile=\S+/'
    - '/^\s*TrustedCertificateFile=\S+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.1.2
      NIST800-53R5:
      - AU-2
      - AU-12
  {{ end }}
{{ end }}
