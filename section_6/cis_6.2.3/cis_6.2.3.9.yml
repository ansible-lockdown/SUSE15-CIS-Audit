---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_9 }}
command:
  auditd_networkmanager_cnf:
    title: 6.2.3.9 | Ensure events that modify /etc/NetworkManager directory are collected | Config
    exec: 'grep -Phs -- ''/etc/NetworkManager'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/NetworkManager/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/NetworkManager/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.9
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_networkmanager_live:
    title: 6.2.3.9 | Ensure events that modify /etc/NetworkManager directory are collected | Live
    exec: 'auditctl -l | grep -P -- ''/etc/NetworkManager'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/NetworkManager/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/NetworkManager/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.9
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
