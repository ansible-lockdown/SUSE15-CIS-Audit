---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_20 }}
command:
  auditd_perm_mod_xattr_cnf:
    title: 6.2.3.20 | Ensure discretionary access control permission modification events setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr collected | Config
    exec: 'grep -Phs -- ''xattr'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/-a (always,exit|exit,always) -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=(unset|4294967295|-1) (-k |-F key=)perm_mod/'
    - '/-a (always,exit|exit,always) -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=(unset|4294967295|-1) (-k |-F key=)perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.20
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_perm_mod_xattr_live:
    title: 6.2.3.20 | Ensure discretionary access control permission modification events setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr collected | Live
    exec: 'auditctl -l | grep -P -- ''xattr'''
    exit-status: 0
    stdout:
    - '/-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=(unset|4294967295|-1) -F key=perm_mod/'
    - '/-a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=(unset|4294967295|-1) -F key=perm_mod/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.20
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
