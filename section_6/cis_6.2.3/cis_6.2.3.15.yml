---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_15 }}
command:
  auditd_opasswd_cnf:
    title: 6.2.3.15 | Ensure events that modify /etc/security/opasswd are collected | Config
    exec: 'grep -Phs -- ''opasswd'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/security/opasswd/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/security/opasswd/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.15
      NIST800-53R5:
      - AU-3
  auditd_opasswd_live:
    title: 6.2.3.15 | Ensure events that modify /etc/security/opasswd are collected | Live
    exec: 'auditctl -l | grep -P -- ''opasswd'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/security/opasswd/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/security/opasswd/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.15
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
