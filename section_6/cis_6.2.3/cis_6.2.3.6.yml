---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_6 }}
command:
  auditd_issue_cnf:
    title: 6.2.3.6 | Ensure events that modify /etc/issue and /etc/issue.net are collected | Config
    exec: 'grep -Phs -- ''issue'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/issue/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/issue/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    - '/^\s*(-w /etc/issue\.net/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/issue\.net/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_issue_live:
    title: 6.2.3.6 | Ensure events that modify /etc/issue and /etc/issue.net are collected | Live
    exec: 'auditctl -l | grep -P -- ''issue'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/issue/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/issue/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    - '/^\s*(-w /etc/issue\.net/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/issue\.net/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.6
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
