---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_14 }}
command:
  auditd_shadow_cnf:
    title: 6.2.3.14 | Ensure events that modify /etc/shadow and /etc/gshadow are collected | Config
    exec: 'grep -Phs -- ''shadow'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/gshadow/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/gshadow/? -F perm=wa (-k |-F key=)identity)\s*$/'
    - '/^\s*(-w /etc/shadow/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/shadow/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.14
      NIST800-53R5:
      - AU-3
  auditd_shadow_live:
    title: 6.2.3.14 | Ensure events that modify /etc/shadow and /etc/gshadow are collected | Live
    exec: 'auditctl -l | grep -P -- ''shadow'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/gshadow/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/gshadow/? -F perm=wa (-k |-F key=)identity)\s*$/'
    - '/^\s*(-w /etc/shadow/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/shadow/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.14
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
