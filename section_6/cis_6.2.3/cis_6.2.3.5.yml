---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_5 }}
command:
  auditd_locale_cnf:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | Config
    exec: 'grep -Phs -- ''(sethostname|setdomainname)'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/-a (always,exit|exit,always) -F arch=b64 -S sethostname,setdomainname (-k |-F key=)system-locale/'
    - '/-a (always,exit|exit,always) -F arch=b32 -S sethostname,setdomainname (-k |-F key=)system-locale/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_locale_live:
    title: 6.2.3.5 | Ensure events that modify sethostname and setdomainname are collected | Live
    exec: 'auditctl -l | grep -P -- ''(sethostname|setdomainname)'''
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S sethostname,setdomainname -F key=system-locale'
    - '-a always,exit -F arch=b32 -S sethostname,setdomainname -F key=system-locale'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.5
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
