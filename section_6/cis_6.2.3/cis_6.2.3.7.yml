---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_7 }}
command:
  auditd_hosts_cnf:
    title: 6.2.3.7 | Ensure events that modify /etc/hosts and /etc/hostname are collected | Config
    exec: 'grep -Phs -- ''/etc/host'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/hosts/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/hosts/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    - '/^\s*(-w /etc/hostname/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/hostname/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_hosts_live:
    title: 6.2.3.7 | Ensure events that modify /etc/hosts and /etc/hostname are collected | Live
    exec: 'auditctl -l | grep -P -- ''/etc/host'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/hosts/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/hosts/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    - '/^\s*(-w /etc/hostname/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/hostname/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
