  {{ if .Vars.suse15cis_rule_6_2_3_7 }}
package:
  rsyslog_pkg:
    title: 6.2.3.7 | Ensure rsyslog logrotate is configured | pkg check
    name: logrotate
    installed: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-8
command:
  rsyslog_logrotate:
    title: 6.2.3.7 | Ensure rsyslog logrotate is configured | Manual Check
    exec: echo "Manual | please check file rotaton matches site policy - logrotate"
    exit-status: 0
    stdout:
    - '!/^Manual/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.7
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
