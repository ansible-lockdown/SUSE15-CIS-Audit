---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_16 }}
command:
  auditd_nsswitch_cnf:
    title: 6.2.3.16 | Ensure events that modify /etc/nsswitch.conf file are collected | Config
    exec: 'grep -Phs -- ''nsswitch'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/nsswitch\.conf/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/nsswitch\.conf/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.16
      NIST800-53R5:
      - AU-3
  auditd_nsswitch_live:
    title: 6.2.3.16 | Ensure events that modify /etc/nsswitch.conf file are collected | Live
    exec: 'auditctl -l | grep -P -- ''nsswitch'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/nsswitch\.conf/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/nsswitch\.conf/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
