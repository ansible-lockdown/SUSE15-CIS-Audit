---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_31 }}
command:
  auditd_module_cnf:
    title: 6.2.3.31 | Ensure kernel module loading unloading and modification is collected | Config
    exec: 'grep -Phs -- ''/usr/bin/kmod'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/-a (always,exit|exit,always)( -F arch=b(32|64))?( -S all)? -F path=\/usr\/bin\/kmod -F perm=x -F auid>=1000 -F auid!=(unset|4294967295|-1) (-k |-F key=)kernel_modules/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.31
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_module_live:
    title: 6.2.3.31 | Ensure kernel module loading unloading and modification is collected | Live
    exec: 'auditctl -l | grep -P -- ''/usr/bin/kmod'''
    exit-status: 0
    stdout:
    - '/-a always,exit( -F arch=b(32|64))? -S all -F path=\/usr\/bin\/kmod -F perm=x -F auid>=1000 -F auid!=(unset|4294967295|-1) -F key=kernel_modules/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.31
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
