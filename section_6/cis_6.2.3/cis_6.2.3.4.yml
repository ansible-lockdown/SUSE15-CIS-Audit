---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_6_2_3_4 }}
command:
  forward_journald_conf:
    title: 6.2.3.4 | Ensure journald is configured to send logs to rsyslog
    exec: systemd-analyze cat-config systemd/journald.conf | grep -i '^\s*ForwardToSyslog' | tail -1
    exit-status: 0
    stdout:
    - '/(?i)^\s*ForwardToSyslog\s*=\s*yes/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.4
      NIST800-53R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
