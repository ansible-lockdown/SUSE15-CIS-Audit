---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_17 }}
command:
  auditd_pam_cnf:
    title: 6.2.3.17 | Ensure events that modify /etc/pam.conf and /etc/pam.d/ information are collected | Config
    exec: 'grep -Phs -- ''/etc/pam'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/pam\.conf/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/pam\.conf/? -F perm=wa (-k |-F key=)identity)\s*$/'
    - '/^\s*(-w /etc/pam\.d/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/pam\.d/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5:
      - AU-3
  auditd_pam_live:
    title: 6.2.3.17 | Ensure events that modify /etc/pam.conf and /etc/pam.d/ information are collected | Live
    exec: 'auditctl -l | grep -P -- ''/etc/pam'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/pam\.conf/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/pam\.conf/? -F perm=wa (-k |-F key=)identity)\s*$/'
    - '/^\s*(-w /etc/pam\.d/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/pam\.d/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
