---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_24 }}
command:
  auditd_delete_unlink_cnf:
    title: 6.2.3.24 | Ensure unlink file deletion events by users are collected | Config
    exec: 'grep -Phs -- ''unlink'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/-a (always,exit|exit,always) -F arch=b64 -S unlink,unlinkat -F auid>=1000 -F auid!=(unset|4294967295|-1) (-k |-F key=)delete/'
    - '/-a (always,exit|exit,always) -F arch=b32 -S unlink,unlinkat -F auid>=1000 -F auid!=(unset|4294967295|-1) (-k |-F key=)delete/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.24
      NIST800-53R5:
      - AU-12
      - SC-7
  auditd_delete_unlink_live:
    title: 6.2.3.24 | Ensure unlink file deletion events by users are collected | Live
    exec: 'auditctl -l | grep -P -- ''unlink'''
    exit-status: 0
    stdout:
    - '/-a always,exit -F arch=b64 -S unlink,unlinkat -F auid>=1000 -F auid!=(unset|4294967295|-1) -F key=delete/'
    - '/-a always,exit -F arch=b32 -S unlink,unlinkat -F auid>=1000 -F auid!=(unset|4294967295|-1) -F key=delete/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.24
      NIST800-53R5:
      - AU-12
      - SC-7
  {{ end }}
{{ end }}
