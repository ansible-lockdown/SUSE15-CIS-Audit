---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_34 }}
command:
  auditd_continue_on_error:
    title: 6.2.3.34 | Ensure the audit configuration is loaded regardless of errors
    exec: grep -Ph -- '^\h*-c\b' /etc/audit/rules.d/*.rules | tail -1
    exit-status: 0
    stdout:
    - '/^\s*-c\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.34
      NIST800-53R5:
      - AU-12
  {{ end }}
{{ end }}
