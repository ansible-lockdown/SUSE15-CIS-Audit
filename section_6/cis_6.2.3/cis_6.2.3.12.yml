---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_12 }}
command:
  auditd_group_cnf:
    title: 6.2.3.12 | Ensure events that modify /etc/group information are collected | Config
    exec: 'grep -Phs -- ''/etc/group'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/group/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/group/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-3
  auditd_group_live:
    title: 6.2.3.12 | Ensure events that modify /etc/group information are collected | Live
    exec: 'auditctl -l | grep -P -- ''/etc/group'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/group/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/group/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.12
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
