---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_13 }}
command:
  auditd_passwd_cnf:
    title: 6.2.3.13 | Ensure events that modify /etc/passwd information are collected | Config
    exec: 'grep -Phs -- ''/etc/passwd'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/passwd/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/passwd/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.13
      NIST800-53R5:
      - AU-3
  auditd_passwd_live:
    title: 6.2.3.13 | Ensure events that modify /etc/passwd information are collected | Live
    exec: 'auditctl -l | grep -P -- ''/etc/passwd'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/passwd/? -p wa -k identity|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/passwd/? -F perm=wa (-k |-F key=)identity)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.13
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
