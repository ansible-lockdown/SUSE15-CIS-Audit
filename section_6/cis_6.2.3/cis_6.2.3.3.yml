---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_3 }}
command:
  auditd_sudolog_chg_cnf:
    title: 6.2.3.3 | Ensure events that modify the sudo log file are collected | Config
    exec: 'grep -Phs -- ''sudo\.log'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /var/log/sudo\.log/? -p wa -k sudo_log_file|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/sudo\.log/? -F perm=wa (-k |-F key=)sudo_log_file)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.3
      NIST800-53R5: NA
  auditd_sudolog_chg_live:
    title: 6.2.3.3 | Ensure events that modify the sudo log file are collected | Live
    exec: 'auditctl -l | grep -P -- ''sudo\.log'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /var/log/sudo\.log/? -p wa -k sudo_log_file|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/sudo\.log/? -F perm=wa (-k |-F key=)sudo_log_file)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
