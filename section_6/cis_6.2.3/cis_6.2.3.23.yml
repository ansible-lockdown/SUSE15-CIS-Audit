---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_6_2_3_23 }}
command:
  auditd_logins_cnf:
    title: 6.2.3.23 | Ensure login and logout events are collected | Config
    exec: 'grep -Phs -- ''(lastlog|faillock)'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /var/log/lastlog/? -p wa -k logins|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/lastlog/? -F perm=wa (-k |-F key=)logins)\s*$/'
    - '/^\s*(-w /var/run/faillock/? -p wa -k logins|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/run/faillock/? -F perm=wa (-k |-F key=)logins)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.23
      NIST800-53R5:
      - AU-3
  auditd_logins_live:
    title: 6.2.3.23 | Ensure login and logout events are collected | Live
    exec: 'auditctl -l | grep -P -- ''(lastlog|faillock)'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /var/log/lastlog/? -p wa -k logins|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/log/lastlog/? -F perm=wa (-k |-F key=)logins)\s*$/'
    - '/^\s*(-w /var/run/faillock/? -p wa -k logins|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/var/run/faillock/? -F perm=wa (-k |-F key=)logins)\s*$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.2.3.23
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
