---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_5_3_3_4_3 }}
file:
  faillock_root_unlock_time:
    title: 5.3.3.4.3 | Ensure password failed attempts lockout includes root account
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^(even_deny_root|root_unlock_time\s*=\s*([6-9][0-9]|[1-9][0-9]{2,})$)/'
    - '!/^root_unlock_time\s*=\s*([0-9]|[1-5][0-9]|60)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.3.3.4.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
