---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_3_2_1 }}
file:
  pam_cracklib_enabled_common_password:
    title: 5.3.2.1 | Ensure pam_cracklib module is enabled | common-password
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '/^\s*password\s+\S+\s+pam_cracklib\.so\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1
      NIST800-53R5: IA-5
  pam_cracklib_enabled_common_password_pc:
    title: 5.3.2.1 | Ensure pam_cracklib module is enabled | common-password-pc
    path: /etc/pam.d/common-password-pc
    exists: true
    contents:
    - '/^\s*password\s+\S+\s+pam_cracklib\.so\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
