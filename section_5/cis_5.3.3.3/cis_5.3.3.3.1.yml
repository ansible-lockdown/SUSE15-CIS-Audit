---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_3_3_3_1 }}
command:
  pam_unix_nullok:
    title: 5.3.3.3.1 | Ensure pam_unix does not include nullok
    exec: pam-config --query --unix --unix-nullok
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*nullok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.3.1
      NIST800-53R5: NA
  {{ end }}
{{ end }}
