---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_2_6 }}
command:
  sudo_timestamp_timeout:
    title: 5.2.6 | Ensure sudo timestamp_timeout is configured
    exec: |
      l_val="$(grep -rhoP '^[^#]*\btimestamp_timeout=\K-?[0-9.]+' /etc/sudoers /etc/sudoers.d 2>/dev/null)"
      [ -z "$l_val" ] && l_val="$(sudo -V 2>/dev/null | awk -F: '/Authentication timestamp timeout:/ {gsub(/[^0-9.-]/, "", $2); print $2}')"
      printf '%s\n' "$l_val" | awk '{ if ($1 == "" || $1 + 0 < 0 || $1 + 0 > 15) print "FAIL: timestamp_timeout " $1; else print "OK: timestamp_timeout " $1 }'
    exit-status: 0
    stdout:
    - '/^OK: timestamp_timeout/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.6
      NIST800-53R5: NA
  {{ end }}
{{ end }}
