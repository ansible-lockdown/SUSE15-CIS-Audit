---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_18 }}
command:
  sshd_maxsessions:
    title: 5.1.18 | Ensure sshd MaxSessions is configured
    exec: "sshd -T 2>/dev/null | grep -Ei '^maxsessions[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^maxsessions\s+([1-9]|10)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.18
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  sshd_maxsessions_config:
    title: 5.1.18 | Ensure sshd MaxSessions is configured | config files
    exec: "grep -Psi -- '^\\h*MaxSessions\\h+\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf"
    exit-status:
      or:
      - 1
      - 2
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.18
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
