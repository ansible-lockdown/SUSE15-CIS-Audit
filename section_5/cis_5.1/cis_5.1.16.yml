---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_16 }}
command:
  sshd_maxauthtries:
    title: 5.1.16 | Ensure sshd MaxAuthTries is configured
    exec: "sshd -T 2>/dev/null | grep -Ei '^maxauthtries[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^maxauthtries\s+[1-4]$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
