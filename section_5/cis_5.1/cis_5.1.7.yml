---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_7 }}
file:
  sshd_access_limited:
    title: 5.1.7 | Ensure sshd access is configured
    path: /etc/ssh/sshd_config
    exists: true
{{ if or .Vars.suse15cis_sshd_allow_users .Vars.suse15cis_sshd_allow_groups .Vars.suse15cis_sshd_deny_users .Vars.suse15cis_sshd_deny_groups }}    contents:
{{ if .Vars.suse15cis_sshd_allow_users }}    - AllowUsers {{ .Vars.suse15cis_sshd_allow_users }}
{{ end }}{{ if .Vars.suse15cis_sshd_allow_groups }}    - AllowGroups {{ .Vars.suse15cis_sshd_allow_groups }}
{{ end }}{{ if .Vars.suse15cis_sshd_deny_users }}    - DenyUsers {{ .Vars.suse15cis_sshd_deny_users }}
{{ end }}{{ if .Vars.suse15cis_sshd_deny_groups }}    - DenyGroups {{ .Vars.suse15cis_sshd_deny_groups }}
{{ end }}{{ end }}    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.7
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
