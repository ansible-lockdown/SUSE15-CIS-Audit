---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_7 }}
command:
  sshd_clientalive:
    title: 5.1.7 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
    exec: "sshd -T 2>/dev/null | grep -Ei '^clientalive(interval|countmax)[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^clientaliveinterval\s+[1-9][0-9]*$/'
    - '/(?i)^clientalivecountmax\s+[1-9][0-9]*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.7
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
