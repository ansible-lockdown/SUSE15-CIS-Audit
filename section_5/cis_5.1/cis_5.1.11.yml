---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_11 }}
command:
  sshd_ignorerhosts:
    title: 5.1.11 | Ensure sshd IgnoreRhosts is enabled
    exec: "sshd -T 2>/dev/null | grep -Ei '^ignorerhosts[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^ignorerhosts\s+yes$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
