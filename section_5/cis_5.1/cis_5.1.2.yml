---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_2 }}
command:
  ssh_host_private_key_access:
    title: 5.1.2 | Ensure access to SSH private host key files is configured
    exec: |
      sshd -T 2>/dev/null | awk 'tolower($1)=="hostkey" {print $2}' | while IFS= read -r l_file; do
        [ -e "$l_file" ] && find -L "$l_file" -maxdepth 0 \( -perm /177 -o ! -user root -o ! -group root \) -printf 'FAIL: %p\n'
      done
      true
    exit-status: 0
    stdout:
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  ssh_host_private_key_found:
    title: 5.1.2 | Ensure access to SSH private host key files is configured | host keys found
    exec: "sshd -T 2>/dev/null | awk 'tolower($1)==\"hostkey\" {print $2}'"
    exit-status: 0
    stdout:
    - '/^\//'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
