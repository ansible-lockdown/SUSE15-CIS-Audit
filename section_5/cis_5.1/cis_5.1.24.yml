---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_5_1_24 }}
command:
  ssh_listen_address:
    title: 5.1.24 | Ensure sshd ListenAddress is configured
    exec: "sshd -T 2>/dev/null | grep -Ei '^listenaddress[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^listenaddress\s+\S+/'
    - '!/(?i)^listenaddress\s+0\.0\.0\.0(:|$)/'
    - '!/(?i)^listenaddress\s+\[?::\]?(:|$)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.1.24
      NIST800-53R5:
      - CM-6
      - CM-7
  {{ end }}
{{ end }}
