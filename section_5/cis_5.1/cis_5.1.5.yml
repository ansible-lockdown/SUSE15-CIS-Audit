---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_5 }}
command:
  sshd_KEX:
    title: 5.1.5 | Ensure sshd KexAlgorithms is configured
    exec: sshd -T | grep ^kex
    exit-status:
      or:
      - 0
      - 1
    stdout:
    {{ range .Vars.suse15cis_sshd_weak_kex }}
    - '!/^KexAlgorithms.*!{{ . }}/'
    {{ end }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.5
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
