---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_10 }}
command:
  sshd_hostbasedauthentication:
    title: 5.1.10 | Ensure sshd HostbasedAuthentication is disabled
    exec: "sshd -T 2>/dev/null | grep -Ei '^hostbasedauthentication[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^hostbasedauthentication\s+no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.10
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
