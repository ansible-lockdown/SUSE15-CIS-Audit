---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.suse15cis_rule_5_1_10 }}
file:
  sshd_disableforwarding:
    title: 5.1.10 | Ensure sshd DisableForwarding is enabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/(?i)DisableForwarding yes/'
    - '!/(?i)^DisableForwarding no/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.10
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
