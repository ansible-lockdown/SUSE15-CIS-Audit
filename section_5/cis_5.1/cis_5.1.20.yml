---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_20 }}
command:
  sshd_permitrootlogin:
    title: 5.1.20 | Ensure sshd PermitRootLogin is disabled
    exec: "sshd -T 2>/dev/null | grep -Ei '^permitrootlogin[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^permitrootlogin\s+no$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.20
      NIST800-53R5:
      - AC-6
  {{ end }}
{{ end }}
