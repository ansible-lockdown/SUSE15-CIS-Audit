---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_1_6 }}
command:
  sshd_ciphers:
    title: 5.1.6 | Ensure sshd Ciphers are configured
    exec: "sshd -T 2>/dev/null | grep -Ei '^ciphers[[:space:]]'"
    exit-status: 0
    stdout:
    - '/(?i)^ciphers\s+\S+/'
    - '!/(?i)^ciphers\s+"?(\S+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se)(,|"|$)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
