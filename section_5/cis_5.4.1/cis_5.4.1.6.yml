---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_4_1_6 }}
command:
  passwd_chg_past:
    title: 5.4.1.6 | Ensure all users last password change date is in the past
    exec: |
      l_today=$(( $(date -u +%s) / 86400 ))
      awk -F: -v now="$l_today" '($2 ~ /^\$.+\$/ && $3 != "" && $3 > now) {print "FAIL: " $1 " last password change is in the future"}' /etc/shadow
    exit-status: 0
    stdout:
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.6
      NIST800-53R5: NA
  {{ end }}
{{ end }}
