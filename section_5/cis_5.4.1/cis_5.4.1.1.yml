---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_4_1_1 }}
file:
  login_defs_max_days:
    title: 5.4.1.1 | Ensure password expiration is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_MAX_DAYS\s+{{ .Vars.suse15cis_pass_max_days }}/'
    - '!/^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])/'
    - '!/^PASS_MAX_DAYS\s+-1/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
command:
  check_user_expiry:
    title: 5.4.1.1 | Ensure password expiration is configured | check_users
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($5 == "" || $5 > {{ .Vars.suse15cis_pass_max_days }} || $5 < 1) print "FAIL: " $1 " PASS_MAX_DAYS: " $5}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    skip: {{ not .Vars.suse15cis_force_user_maxdays }}
    skip-reason: suse15cis_force_user_maxdays is false, existing accounts are not changed by the role
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
