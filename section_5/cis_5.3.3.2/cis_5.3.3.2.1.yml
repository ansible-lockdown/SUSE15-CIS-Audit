---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_5_3_3_2_1 }}
command:
  pwhistory_remember_use_pam:
    title: 5.3.3.2.1 | Ensure password history remember is configured
    exec: pam-config --query --pwhistory --pwhistory-remember
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/password:.*remember\s*=\s*(2[4-9])/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.1
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
