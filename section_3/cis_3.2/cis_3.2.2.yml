---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_3_2_2 }}
command:
  modprobe_can:
    title: 3.2.2 | Ensure can kernel module is not available | can config
    exit-status: 0
    exec: 'modprobe -n -v can'
    stdout:
      - '/install \/bin\/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  lsmod_can:
    title: 3.2.2 | Ensure can kernel module is not available | running can
    exit-status: 1
    exec: lsmod | grep -Ew '^can'
    stdout:
    - '!/^.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  blacklist_can:
    title: 3.2.2 | Ensure can kernel module is not available | can deny listed
    exit-status: 0
    exec: "modprobe --showconfig | grep -P -- '^blacklist\\h+can$'"
    stdout:
    - '/^blacklist\s+can$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
