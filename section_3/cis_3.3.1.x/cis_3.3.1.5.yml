---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_3_3_1_5 }}
kernel-param:
  net_ipv4_conf_default_send_redirects:
    title: 3.3.1.5 | Ensure net.ipv4.conf.default.send_redirects is configured
    skip: {{ .Vars.suse15cis_is_router }}
