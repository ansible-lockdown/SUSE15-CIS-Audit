    name: net.ipv4.conf.default.send_redirects
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.1.5
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
