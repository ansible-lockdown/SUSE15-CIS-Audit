---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_3_3_2_5 }}
kernel-param:
  net_ipv6_conf_all_accept_source_route:
    title: 3.3.2.5 | Ensure net.ipv6.conf.all.accept_source_route is configured
    skip: {{ or .Vars.suse15cis_is_router (not .Vars.suse15cis_ipv6_required) }}
    skip-reason: {{ if .Vars.suse15cis_is_router }}this host is a router, suse15cis_is_router is true{{ else }}IPv6 is not required, suse15cis_ipv6_required is false{{ end }}
    name: net.ipv6.conf.all.accept_source_route
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.5
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
