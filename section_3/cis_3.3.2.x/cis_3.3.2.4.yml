    name: net.ipv6.conf.default.accept_redirects
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.2.4
      NIST800-53R5:
      - CM-6
  {{ end }}
{{ end }}
