---

{{ if .Vars.suse15cis_level_1 }}
  {{ if not .Vars.suse15cis_ipv6_required }}
    {{ if .Vars.suse15cis_rule_3_1_1 }}
command:
  ipv6_disabled:
    title: 3.1.1 | Ensure IPv6 status is identified | sysctl all disable
    exec: |
      [ -d /proc/sys/net/ipv6 ] || { echo "IPv6 disabled in the kernel"; exit 0; }
      f=/etc/sysctl.d/60-disable_ipv6.conf
      grep -Eq '^\s*net\.ipv6\.conf\.all\.disable_ipv6\s*=\s*1' "$f" && grep -Eq '^\s*net\.ipv6\.conf\.default\.disable_ipv6\s*=\s*1' "$f" && echo "IPv6 disabled by sysctl"
    exit-status: 0
    stdout:
    - '/^IPv6 disabled (in the kernel|by sysctl)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID: 3.1.1
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
