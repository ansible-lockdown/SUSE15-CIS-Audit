---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_1_4_1 }}
  file:
    grub_bootloader_passwd:
      title: 1.4.1 | Ensure bootloader password is set
      skip: {{ not .Vars.suse15cis_set_boot_pass }}
      skip-reason: the bootloader password is not managed, suse15cis_set_boot_pass is false
      path: /boot/grub2/grub.cfg
      exists: true
      owner: root
      group: root
      mode: "0600"
      contents:
      - '/^\s*set superusers={{ .Vars.suse15cis_grub_user }}/'
      - '/^\s*password_pbkdf2.*\s{{ .Vars.suse15cis_bootloader_password_hash }}/'
      meta:
        server: 1
        workstation: 1
        CIS_ID:
        - 1.4.1
        NIST800-53R5: AC-3
  {{ end }}
{{ end }}
