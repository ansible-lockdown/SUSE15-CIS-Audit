---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_1_5_7 }}
file:
  coredump_conf_d_processsizemax:
    title: 1.5.7 | Ensure systemd-coredump ProcessSizeMax is configured
    path: /etc/systemd/coredump.conf.d/60-cis.conf
    exists: true
    contents:
    - '/^\s*ProcessSizeMax\s*=\s*0/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.7
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
