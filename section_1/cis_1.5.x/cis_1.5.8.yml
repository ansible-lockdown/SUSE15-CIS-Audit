---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_1_5_8 }}
file:
  coredump_conf_d_storage:
    title: 1.5.8 | Ensure systemd-coredump Storage is configured
    path: /etc/systemd/coredump.conf.d/60-cis.conf
    exists: true
    contents:
    - '/^\s*Storage\s*=\s*none/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.8
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
