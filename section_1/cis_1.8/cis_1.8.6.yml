---

{{ if .Vars.suse15cis_gui }}
  {{ if .Vars.suse15cis_level_1 }}
    {{ if .Vars.suse15cis_rule_1_8_6 }}
command:
  gdm_xdmcp_disabled:
    title: 1.8.6 | Ensure XDMCP is not enabled
    exec: |
      for l_file in /etc/gdm/custom.conf /etc/gdm/daemon.conf; do
        [ -f "$l_file" ] && awk '/^[[:space:]]*\[xdmcp\]/{f=1;next} /^[[:space:]]*\[/{f=0} f && /^[[:space:]]*Enable[[:space:]]*=[[:space:]]*true/{print "FAIL: " FILENAME ": " $0}' "$l_file"
      done
      echo scan_done
    exit-status: 0
    stdout:
    - '/scan_done/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.8.6
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
