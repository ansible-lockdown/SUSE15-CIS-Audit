---

{{ if .Vars.suse15cis_level_2 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.suse15cis_rule_1_2_1_3 }}
command:
  repo_gpgcheck_global:
    title: 1.2.1.3 | Ensure repo_gpgcheck is globally activated
    exec: grep -E "^repo_gpgcheck" /etc/zypp/zypp.conf
    timeout: {{ .Vars.timeout_ms }}
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^repo_gpgcheck( |)=( |)(1|on)/'
    - '!/^repo_gpgcheck( |)=( |)(0|false|off|no)/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
  repo_gpgcheck_repo:
    title: 1.2.1.3 | Ensure repo_gpgcheck is globally activated
    exec: grep -RPi -- '^\h*repo_gpgcheck\h*=\h*(0|false|no|off)\b' /etc/zypp/repos.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
    {{ end }}
  {{ end }}
{{ end }}
