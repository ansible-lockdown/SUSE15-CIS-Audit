---

{{ if .Vars.suse15cis_level_1 }}
  {{ if .Vars.suse15cis_rule_1_2_2_1 }}
command:
  package-updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed | packages
    skip: {{ not .Vars.run_heavy_tests }}
    skip-reason: heavy tests are off, run_heavy_tests is false
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    exec: zypper lu
    stdout:
    - "No updates found."
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.2.1
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
